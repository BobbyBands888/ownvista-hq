name: YouTube fetch (Bobby's Mac)
# YouTube blocks GitHub's cloud servers ("confirm you're not a bot"), so agency YouTube posts are pulled on Bobby's
# Mac (GitHub self-hosted runner "Roberts-Air", installed Nov 20) and kept as footage copies the cloud publisher
# restores. Set the repo variable YT_FETCH_OFF=1 to pause it.
on:
  schedule:
    - cron: "11,41 * * * *"      # every 30 min; a sleeping Mac just picks it up when it wakes
  workflow_dispatch:
permissions:
  contents: write                # stores the footage copies on footage-<lead>-post releases
concurrency:
  group: ytfetch
  cancel-in-progress: false
jobs:
  fetch:
    if: ${{ vars.YT_FETCH_OFF != '1' }}
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # actions/setup-python can't install on a personal Mac (it wants /Users/runner); uv brings its own Python
      - name: uv (free, one-time install into ~/.local/bin)
        run: |
          command -v uv >/dev/null 2>&1 || [ -x "$HOME/.local/bin/uv" ] || curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: >-
          uv run --python 3.12 --no-project --with requests --with "yt-dlp[default]" --with imageio-ffmpeg --with deno --with pillow
          python mac/ytfetch.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # age-gated YouTube posts: browser on the Mac that's signed into YouTube (chrome / firefox / safari)
          YT_COOKIES_BROWSER: ${{ vars.YT_COOKIES_BROWSER || 'chrome' }}
