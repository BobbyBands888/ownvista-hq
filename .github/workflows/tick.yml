name: HQ tick
on:
  schedule:
    - cron: "7 * * * *"          # every hour at :07
  workflow_dispatch:
    inputs:
      agent:
        description: "Run one agent now (research, scout, outreach, portal_filer, tracker, maker, compliance, analytics, overseer) or 'tick'. Gleamstone: gs:scout, gs:map, gs:enrich, gs:inbox, gs:writer, gs:sender, gs:brief, gs:recruit"
        default: "tick"
permissions:
  contents: read
concurrency:
  group: hq-tick
  cancel-in-progress: false
jobs:
  run:
    runs-on: ${{ vars.HQ_RUNNER || 'ubuntu-latest' }}   # public repo: free minutes; HQ_RUNNER=self-hosted = Bobby's Mac
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ten-Four Tapes agents
        if: ${{ !startsWith(github.event.inputs.agent || 'tick', 'gs:') }}
        run: python -m agents.run "${{ github.event.inputs.agent || 'tick' }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DVIDS_API_KEY: ${{ secrets.DVIDS_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          DRY_RUN: ${{ vars.DRY_RUN || '0' }}
      - name: Gleamstone agents
        if: ${{ always() && ((github.event.inputs.agent || 'tick') == 'tick' || startsWith(github.event.inputs.agent, 'gs:')) }}
        run: |
          A="${{ github.event.inputs.agent || 'tick' }}"
          python -m gleamstone.run "${A#gs:}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          ZOHO_IMAP_USER: ${{ secrets.ZOHO_IMAP_USER }}
          ZOHO_IMAP_PASSWORD: ${{ secrets.ZOHO_IMAP_PASSWORD }}
          PYTHONUNBUFFERED: "1"
          DRY_RUN: ${{ vars.DRY_RUN || '0' }}
