name: Publisher (render + post)
on:
  schedule:
    - cron: "41 */2 * * *"       # every 2 hours; renders approved plans, posts approved videos
  workflow_dispatch:
permissions:
  contents: write                # stores review copies of rendered videos on the "renders" release
concurrency:
  group: publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TENFOUR_HOME: ${{ github.workspace }}/.tft
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r mac/requirements-mac.txt
      - name: Narrator voice + fonts (cached)
        id: models
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.TENFOUR_HOME }}/models
            ${{ env.TENFOUR_HOME }}/fonts
          key: tft-models-v1
      - if: steps.models.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$TENFOUR_HOME/models" "$TENFOUR_HOME/fonts"
          KO=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -L --fail -o "$TENFOUR_HOME/models/kokoro-v1.0.onnx" "$KO/kokoro-v1.0.onnx"
          curl -L --fail -o "$TENFOUR_HOME/models/voices-v1.0.bin" "$KO/voices-v1.0.bin"
          curl -L --fail -o /tmp/inter.zip https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip
          unzip -j -o -q /tmp/inter.zip "extras/ttf/Inter-Black.ttf" "extras/ttf/Inter-Bold.ttf" -d "$TENFOUR_HOME/fonts"
      - name: Restore footage + transcripts
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TENFOUR_HOME }}/footage
          key: tft-footage-${{ github.run_id }}
          restore-keys: tft-footage-
      - run: python mac/runner.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          DVIDS_API_KEY: ${{ secrets.DVIDS_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          DRY_RUN: ${{ vars.DRY_RUN || '0' }}
      - name: Save footage + transcripts
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TENFOUR_HOME }}/footage
          key: tft-footage-${{ github.run_id }}
