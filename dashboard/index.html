<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Ownvista HQ</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232f5bd3'/><path d='M9 22V10h3l4 7 4-7h3v12h-3v-7l-4 6-4-6v7z' fill='white'/></svg>">
  <link rel="stylesheet" href="/styles.css">
  <script src="/config.js"></script>
</head>
<body>
  <div id="login" class="login hidden">
    <div class="card stack">
      <h1>Ownvista HQ</h1>
      <p class="muted small">Sign in with a magic link. Only Bobby's email can open this control room.</p>
      <form id="login-form" class="stack">
        <input id="login-email" type="email" autocomplete="email" placeholder="you@example.com" required>
        <button class="primary" type="submit">Email me a sign-in link</button>
      </form>
      <p id="login-msg" class="small muted"></p>
    </div>
  </div>

  <div id="app" class="app hidden">
    <aside class="side">
      <div class="logo">Ownvista <span>HQ</span></div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <button id="theme-btn" type="button">Theme</button>
        <button id="signout-btn" type="button">Sign out</button>
      </div>
    </aside>
    <main id="view"></main>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
