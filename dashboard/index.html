<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ten-Four HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0e1013;--panel:#161a1f;--line:#262c34;--text:#e6e8eb;--dim:#8b939e;--amber:#f2b33d;--green:#3ecf8e;--red:#ff5d5d;--blue:#5aa9ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.brand{font:600 15px "IBM Plex Mono",monospace;letter-spacing:.08em}.brand b{color:var(--amber)}
header .sp{flex:1}button{font:500 13px "IBM Plex Sans";border:1px solid var(--line);background:var(--panel);color:var(--text);padding:6px 11px;border-radius:6px;cursor:pointer}
button:hover{border-color:var(--dim)}button.ok{border-color:#2a6b4f;color:var(--green)}button.no{border-color:#6b2a2a;color:var(--red)}
main{max-width:1200px;margin:0 auto;padding:18px 16px 60px;display:grid;gap:16px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
h2{margin:0 0 10px;font:600 12px "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.agents{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.agent{border:1px solid var(--line);border-radius:8px;padding:9px 10px}.agent .n{font:600 13px "IBM Plex Mono"}
.agent .s{color:var(--dim);font-size:12px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--dim)}.dot.ok{background:var(--green)}.dot.error{background:var(--red)}.dot.running{background:var(--blue)}
.row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
.row .main{flex:1;min-width:0}.t{font-weight:500}.m{color:var(--dim);font-size:12px;margin-top:2px;word-break:break-word}
.tag{font:600 10px "IBM Plex Mono";padding:2px 6px;border-radius:4px;border:1px solid var(--line);color:var(--dim);text-transform:uppercase;white-space:nowrap}
.tag.urgent,.tag.fail{color:var(--red);border-color:#6b2a2a}.tag.warn,.tag.pending{color:var(--amber);border-color:#6b5520}.tag.pass{color:var(--green);border-color:#2a6b4f}
.stats{display:flex;gap:18px;flex-wrap:wrap}.stat .v{font:600 22px "IBM Plex Mono"}.stat .l{color:var(--dim);font-size:12px}
input{background:var(--bg);border:1px solid var(--line);color:var(--text);padding:6px 8px;border-radius:6px;font:13px "IBM Plex Sans";width:100%}
.empty{color:var(--dim);font-size:13px}.btns{display:flex;gap:6px;flex-wrap:wrap}
#login{max-width:380px;margin:12vh auto;padding:24px}#login p{color:var(--dim)}
a{color:var(--blue)}
</style>
</head>
<body>
<header><div class="brand">TEN-FOUR <b>HQ</b></div><div class="sp"></div><span id="who" class="m"></span><button id="refresh">Refresh</button><button id="out" hidden>Sign out</button></header>

<section id="login" hidden>
  <h2>Sign in</h2>
  <p>Enter your email and we'll send a sign-in link.</p>
  <input id="email" type="email" placeholder="you@example.com" autocomplete="email">
  <p><button id="send" class="ok">Send link</button></p>
  <p id="lmsg"></p>
</section>

<main id="app" hidden>
  <section><h2>Agents</h2><div class="agents" id="agents"></div></section>
  <div class="grid">
    <section><h2>Needs you</h2><div id="needs"></div></section>
    <section><h2>Pipeline</h2><div class="stats" id="stats"></div><h2 style="margin-top:16px">Audience</h2><div class="stats" id="aud"></div></section>
  </div>
  <section><h2>Content queue</h2><div id="queue"></div></section>
  <div class="grid">
    <section><h2>Top leads</h2><div id="leads"></div></section>
    <section><h2>Records requests</h2><div id="reqs"></div></section>
  </div>
  <div class="grid">
    <section><h2>Agencies missing a records contact</h2><div id="agencies"></div></section>
    <section><h2>Playbook — what works</h2><div id="playbook"></div></section>
  </div>
  <section><h2>Controls</h2><div id="controls" class="btns"></div></section>
</main>

<script>
const sb = supabase.createClient(window.HQ.SUPABASE_URL, window.HQ.SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago = t => { if(!t) return "never"; const m=(Date.now()-new Date(t))/6e4; return m<60?`${m|0}m ago`:m<1440?`${(m/60)|0}h ago`:`${(m/1440)|0}d ago`; };
const AGENTS = ["research","scout","outreach","tracker","maker","compliance","analytics","overseer","mac_runner","publisher"];

async function load(){
  const [runs, alerts, content, leads, reqs, agencies, playbook, metrics, settings] = await Promise.all([
    sb.from("agent_runs").select("*").order("started_at",{ascending:false}).limit(300),
    sb.from("alerts").select("*").eq("resolved",false).order("created_at",{ascending:false}).limit(40),
    sb.from("content").select("*").neq("status","posted").order("created_at",{ascending:false}).limit(60),
    sb.from("leads").select("*").in("status",["new","obtained","requested"]).order("action_score",{ascending:false}).limit(15),
    sb.from("records_requests").select("*").order("created_at",{ascending:false}).limit(25),
    sb.from("agencies").select("*").is("records_email",null).is("portal_url",null).limit(25),
    sb.from("playbook").select("*").eq("active",true).order("created_at",{ascending:false}).limit(16),
    sb.from("metrics").select("*").in("external_id",["channel","page"]).order("captured_on",{ascending:false}).limit(4),
    sb.from("settings").select("*"),
  ]);
  const S = Object.fromEntries((settings.data||[]).map(s=>[s.key,s.value]));

  // agents
  $("agents").innerHTML = AGENTS.filter(a => a!=="publisher").map(a=>{
    const r=(runs.data||[]).find(x=>x.agent===a);
    return `<div class="agent"><div class="n"><span class="dot ${r?.status||""}"></span>${a.replace("_"," ")}</div>
      <div class="s" title="${esc(r?.summary||r?.error||"")}">${r?ago(r.started_at)+" · "+esc(r.status==="error"?"error":r.summary):"not run yet"}</div></div>`;}).join("");

  // needs you
  const approvals=(content.data||[]).filter(c=>c.compliance_status==="pass"&&c.approval_status==="pending");
  const needs=[];
  if(approvals.length) needs.push(`<div class="row"><span class="tag pending">approve</span><div class="main"><div class="t">${approvals.length} video plan(s) waiting for your OK</div><div class="m">See Content queue below</div></div></div>`);
  for(const a of alerts.data||[]) needs.push(`<div class="row"><span class="tag ${a.level}">${a.level}</span><div class="main"><div class="t">${esc(a.message)}</div><div class="m">${esc(a.agent)} · ${ago(a.created_at)}</div></div><button data-resolve="${a.id}">Done</button></div>`);
  $("needs").innerHTML = needs.join("") || `<div class="empty">Nothing needs you right now.</div>`;

  // stats
  const cnt = async (t,f)=>{let q=sb.from(t).select("id",{count:"exact",head:true});for(const[k,v]of Object.entries(f))q=Array.isArray(v)?q.in(k,v):q.eq(k,v);return (await q).count??0};
  const [nl,rq,ob,pl,po] = await Promise.all([cnt("leads",{status:"new"}),cnt("records_requests",{status:["sent","acknowledged","fee_quoted","clarify"]}),
    cnt("leads",{status:"obtained"}),cnt("content",{status:"scripted"}),cnt("content",{status:"posted"})]);
  $("stats").innerHTML=[[nl,"open leads"],[rq,"requests out"],[ob,"footage in hand"],[pl,"plans to render"],[po,"posted"]]
    .map(([v,l])=>`<div class="stat"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("");
  const yt=(metrics.data||[]).find(m=>m.platform==="youtube"), fb=(metrics.data||[]).find(m=>m.platform==="facebook");
  $("aud").innerHTML=[[yt?.followers??"–","YouTube subs"],[yt?.views??"–","YouTube views"],[fb?.followers??"–","Facebook followers"]]
    .map(([v,l])=>`<div class="stat"><div class="v">${Number(v)?Number(v).toLocaleString():v}</div><div class="l">${l}</div></div>`).join("");

  // queue
  window._content=content.data||[];
  $("queue").innerHTML=(content.data||[]).map(c=>{
    const btns=c.compliance_status==="pass"&&c.approval_status==="pending"
      ?`<button class="ok" data-approve="${c.id}">Approve</button><button class="no" data-reject="${c.id}">Reject</button>`
      :c.approval_status==="rejected"&&c.status==="rendered"
      ?`<button data-recut="${c.id}">Re-cut</button>`
      :c.compliance_status==="fail"&&/minors not confirmed/.test(c.compliance_notes||"")
      ?`<button data-nominors="${c.lead_id}">Confirm no minors</button>`:"";
    return `<div class="row"><span class="tag">${c.kind}${c.part?" "+c.part:""}</span><div class="main"><div class="t">${esc(c.title||c.case_name)}</div>
      <div class="m">${esc(c.case_name)} · ${c.status} · ${esc(c.source_credit||"")}</div>
      ${c.compliance_notes?`<div class="m">${esc(c.compliance_notes)}</div>`:""}${c.publish_note?`<div class="m">${esc(c.publish_note).replace(/(https:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener"><b>▶ Watch video</b></a>')}</div>`:""}</div>
      <span class="tag ${c.compliance_status}">${c.compliance_status}</span><span class="tag ${c.approval_status==="pending"?"pending":""}">${c.approval_status.replace("_"," ")}</span><div class="btns">${btns}</div></div>`;
  }).join("")||`<div class="empty">No content in the queue yet.</div>`;

  $("leads").innerHTML=(leads.data||[]).map(l=>`<div class="row"><span class="tag">${l.action_score??"–"}/10</span><div class="main"><div class="t">${esc(l.title)}</div>
    <div class="m">${esc(l.agency_name||"")} ${l.state?"· "+l.state:""} · ${l.status} · <a href="${esc(l.source_url)}" target="_blank" rel="noopener">source</a></div></div></div>`).join("")||`<div class="empty">No leads yet.</div>`;

  $("reqs").innerHTML=(reqs.data||[]).map(r=>`<div class="row"><span class="tag ${r.status==="fee_quoted"||r.status==="clarify"?"warn":r.status==="fulfilled"?"pass":""}">${r.status.replace("_"," ")}</span>
    <div class="main"><div class="t">${esc(r.subject?.replace("Public Records Request – Body Camera Video – ",""))}</div><div class="m">${esc(r.to_email)} · sent ${ago(r.sent_at)}${r.fee_quote?" · fee: "+esc(r.fee_quote):""}</div></div></div>`).join("")||`<div class="empty">No requests sent yet.</div>`;

  $("agencies").innerHTML=(agencies.data||[]).map(a=>`<div class="row"><div class="main"><div class="t">${esc(a.name)} ${a.state?"· "+a.state:""}</div>
    <div class="m">${esc(a.notes||"")}</div><input placeholder="records email" data-agemail="${a.id}"><input placeholder="or portal link" data-agportal="${a.id}" style="margin-top:4px"></div><button data-agsave="${a.id}">Save</button></div>`).join("")||`<div class="empty">Every agency has a contact.</div>`;

  $("playbook").innerHTML=(playbook.data||[]).map(p=>`<div class="row"><span class="tag">${esc(p.category)}</span><div class="main"><div class="t">${esc(p.insight)}</div><div class="m">${esc(p.source)}</div></div></div>`).join("")||`<div class="empty">Research runs daily — insights appear after the first run.</div>`;

  const paused=S.posting_paused===true;
  $("controls").innerHTML=`<button data-set="posting_paused" data-val="${!paused}" class="${paused?"ok":"no"}">${paused?"Resume posting":"Pause all posting"}</button>
    <button data-set="approval_required_until" data-val="2000-01-01">Switch to full auto (no approvals)</button>
    <span class="m" style="align-self:center">${String(S.approval_required_until)>"2090"?`Approvals on · each format auto-posts after ${esc(S.auto_post_after_approvals??10)} approvals in a row`:`Approvals required until ${esc(S.approval_required_until)}`} · outreach cap ${esc(S.outreach_daily_cap)}/day</span>`;
}

document.addEventListener("click", async e=>{
  const d=e.target.dataset; if(!Object.keys(d).length) return;
  if(d.approve) await sb.from("content").update({approval_status:"approved"}).eq("id",d.approve);
  if(d.reject){ const why=prompt("Why reject it? (the agents learn from this)","");
                if(why===null) return;
                await sb.from("content").update({approval_status:"rejected",publish_note:"Rejected: "+(why.trim()||"no reason given")}).eq("id",d.reject); }
  if(d.recut){ const row=(window._content||[]).find(c=>c.id===d.recut)||{};
                const was=(row.publish_note||"").replace(/^Rejected:\s*/,"");
                const why=prompt("What should the re-cut fix? (it picks new moments using what's on screen)",was);
                if(why===null) return;
                await sb.from("content").update({status:"scripted",approval_status:"approved",
                  publish_note:"Re-cut: "+(why.trim()||was||"pick better moments")}).eq("id",d.recut); }
  if(d.resolve) await sb.from("alerts").update({resolved:true}).eq("id",d.resolve);
  if(d.nominors){ await sb.from("leads").update({involves_minor:false}).eq("id",d.nominors);
                  await sb.from("content").update({compliance_status:"pending"}).eq("lead_id",d.nominors); }
  if(d.agsave){ const em=document.querySelector(`[data-agemail="${d.agsave}"]`).value.trim(), po=document.querySelector(`[data-agportal="${d.agsave}"]`).value.trim();
                if(em||po) await sb.from("agencies").update({records_email:em||null,portal_url:po||null}).eq("id",d.agsave); }
  if(d.set){ if(d.set==="approval_required_until" && !confirm("Turn off approvals? Videos that pass compliance will post automatically.")) return;
             await sb.from("settings").update({value:JSON.parse(d.val==="true"||d.val==="false"?d.val:JSON.stringify(d.val)),updated_at:new Date().toISOString()}).eq("key",d.set); }
  load();
});
$("refresh").onclick=load;
$("send").onclick=async()=>{const {error}=await sb.auth.signInWithOtp({email:$("email").value.trim(),options:{emailRedirectTo:location.origin}});$("lmsg").textContent=error?error.message:"Check your email for the link.";};
$("out").onclick=async()=>{await sb.auth.signOut();location.reload();};
(async()=>{const {data:{session}}=await sb.auth.getSession();
  if(!session){$("login").hidden=false;return;}
  $("who").textContent=session.user.email;$("out").hidden=false;$("app").hidden=false;load();setInterval(load,60000);})();
</script>
</body>
</html>
